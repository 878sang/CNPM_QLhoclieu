<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Decorative circles -->
  <circle cx="700" cy="80" r="140" fill="#60a5fa" fill-opacity="0.18" />
  <circle cx="100" cy="380" r="180" fill="#818cf8" fill-opacity="0.2" />
  <circle cx="750" cy="400" r="100" fill="#38bdf8" fill-opacity="0.12" />

  <!-- Center Card Glassmorphism -->
  <g transform="translate(260, 95)">
    <rect width="280" height="260" rx="24" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- Central Learning Icon (Book & Graduation) -->
    <g transform="translate(90, 70)" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Graduation Cap -->
      <polygon points="50,10 95,30 50,50 5,30" fill="#ffffff" fill-opacity="0.25" />
      <polygon points="50,10 95,30 50,50 5,30" />
      <path d="M25,40 v25 c0,12 25,20 25,20 c0,0 25,-8 25,-20 v-25" fill="#ffffff" fill-opacity="0.2" />
      <path d="M95,30 v35" />
      <circle cx="95" cy="68" r="3" fill="#ffffff" />
    </g>

    <!-- Subtitle text -->
    <text x="140" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#ffffff" fill-opacity="0.9" text-anchor="middle" letter-spacing="1.5">
      KHÓA HỌC TRỰC TUYẾN
    </text>
  </g>
</svg>

